[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pagewise"
version = "0.1.0"
description = "Answer questions from a PDF/DOCX/TXT by finding the passage that already contains the answer. No LLM, no API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Pagewise Contributors" }]
keywords = ["pdf", "docx", "question-answering", "search", "chatbot", "bm25", "retrieval", "no-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rank-bm25>=0.2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/sharif779/pagewise"
Issues = "https://github.com/sharif779/pagewise/issues"

[project.scripts]
pagewise = "pagewise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pagewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
